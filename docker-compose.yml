services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ipsakti
      POSTGRES_PASSWORD: ipsakti
      POSTGRES_DB: ipsakti
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsakti"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ipsakti:ipsakti@postgres:5432/ipsakti
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
